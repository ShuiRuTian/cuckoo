[workspace]
resolver = "2"
members = [
    "crates/cuckoo-core",
    "crates/cuckoo-macros",
    "crates/cuckoo-store",
    "crates/cuckoo-http",
    "crates/cuckoo-ws",
    "crates/cuckoo-graphql",
    "crates/cuckoo-proxy",
    "crates/cuckoo-ca",
    "crates/cuckoo-flow",
    "crates/cuckoo-platform",
    "crates/cuckoo-templates",
    "crates/cuckoo-dto",
    "crates/cuckoo-service",
    "apps/cuckoo-server",
    "apps/cuckoo-desktop/src-tauri",
    "apps/cuckoo-cli",
    "apps/cuckoo-mcp",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/example/cuckoo"

[workspace.dependencies]
# 内部 crate
cuckoo-core = { path = "crates/cuckoo-core" }
cuckoo-macros = { path = "crates/cuckoo-macros" }
cuckoo-store = { path = "crates/cuckoo-store" }
cuckoo-http = { path = "crates/cuckoo-http" }
cuckoo-ws = { path = "crates/cuckoo-ws" }
cuckoo-graphql = { path = "crates/cuckoo-graphql" }
cuckoo-proxy = { path = "crates/cuckoo-proxy" }
cuckoo-ca = { path = "crates/cuckoo-ca" }
cuckoo-flow = { path = "crates/cuckoo-flow" }
cuckoo-platform = { path = "crates/cuckoo-platform" }
cuckoo-templates = { path = "crates/cuckoo-templates" }
cuckoo-dto = { path = "crates/cuckoo-dto" }
cuckoo-service = { path = "crates/cuckoo-service" }
cuckoo-server = { path = "apps/cuckoo-server" }

# 异步运行时
tokio = { version = "1", features = ["full"] }
futures = "0.3"
async-trait = "0.1"

# 序列化
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ts-rs = "12"

# HTTP / Web 框架
axum = { version = "0.8", features = ["macros"] }
tower = "0.5"
tower-http = { version = "0.7", features = ["cors", "trace"] }
reqwest = { version = "0.13", features = ["json", "stream", "query"] }
http = "1"

# 日志
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# 错误处理
thiserror = "2"
anyhow = "1"

# 数据库 ORM
sea-orm = { version = "2", features = ["sqlx-sqlite", "runtime-tokio-rustls", "macros", "with-json"] }
sea-orm-migration = { version = "2", features = ["sqlx-sqlite", "runtime-tokio-rustls"] }

# 工具
uuid = { version = "1", features = ["v4", "serde"] }
ulid = { version = "1", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
dirs = "6"
rand = "0.10"
once_cell = "1"
chrono = { version = "0.4", features = ["serde"] }
base64 = "0.22"

# proc-macro 相关（cuckoo-macros 使用）
syn = { version = "3", features = ["full"] }
quote = "1"
proc-macro2 = "1"
inventory = "0.3"
regex = "1"

# TLS / 证书（cuckoo-ca / cuckoo-proxy 使用）
rcgen = "0.13"
rustls = { version = "0.23", features = ["ring"] }
rustls-pemfile = "2"
tokio-rustls = "0.26"
dashmap = "6"
parking_lot = "0.12"
time = "0.3"
sha2 = "0.10"
bytes = "1.7"
rustls-native-certs = "0.7"
